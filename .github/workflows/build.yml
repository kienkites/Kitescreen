name: Build Kitescreen
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check frame wire protocol
        run: dotnet run --project windows/Kitescreen.ProtocolChecks --configuration Release
      - name: Build Windows host
        run: dotnet build windows/Kitescreen.sln --configuration Release
      - name: Check virtual display frame pipe
        run: dotnet run --project windows/Kitescreen.ExtendChecks --configuration Release
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android receiver
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kitescreen-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
