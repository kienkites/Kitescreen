name: Build experimental display driver
on:
  push:
    branches: [main]
    paths:
      - 'driver/prototype/**'
      - '.github/workflows/driver.yml'
  pull_request:
    paths:
      - 'driver/prototype/**'
      - '.github/workflows/driver.yml'
permissions:
  contents: read
jobs:
  driver:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: NuGet/setup-nuget@v2
      - uses: microsoft/setup-msbuild@v2
      - name: Restore SDK and WDK
        shell: pwsh
        run: nuget restore .\driver\prototype\packages.config -PackagesDirectory .\driver\prototype\packages\
      - name: Compile x64 indirect display driver
        shell: pwsh
        run: |
          $tools = Get-ChildItem .\driver\prototype\packages -Recurse -Filter stampinf.exe | Where-Object { $_.DirectoryName -match '\\x64$' } | Select-Object -First 1
          if (-not $tools) { throw 'WDK x64 stampinf.exe is missing' }
          Write-Host "Using WDK tools at $($tools.DirectoryName)"
          $env:PATH = "$($tools.DirectoryName);$env:PATH"
          msbuild .\driver\prototype\IddSampleDriver\IddSampleDriver.vcxproj /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:EnableInfVerif=false /p:RunCodeAnalysis=false /p:EnablePREfast=false /p:CompileOnly=true /p:ApiValidator_Enable=false
      - name: Validate INF and make a signed VM test package
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'KitescreenDriverTest'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item .\driver\prototype\IddSampleDriver\IddSampleDriver.inf $stage
          Copy-Item .\driver\prototype\IddSampleDriver\x64\Release\IddSampleDriver.dll $stage
          $inf2cat = Get-ChildItem .\driver\prototype\packages -Recurse -Filter Inf2Cat.exe | Where-Object { $_.DirectoryName -match '\\x64$' } | Select-Object -First 1
          if (-not $inf2cat) { throw 'WDK x64 Inf2Cat.exe is missing' }
          & $inf2cat.FullName "/driver:$stage" /os:10_GE_X64
          if ($LASTEXITCODE -ne 0) { throw 'INF validation or catalog creation failed' }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Kitescreen VM Test Only' -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable
          Export-Certificate -Cert $cert -FilePath (Join-Path $stage 'Kitescreen-Test.cer') | Out-Null
          $signTool = Get-ChildItem .\driver\prototype\packages -Recurse -Filter signtool.exe | Where-Object { $_.DirectoryName -match '\\x64$' } | Select-Object -First 1
          if (-not $signTool) { throw 'SDK x64 signtool.exe is missing' }
          & $signTool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My (Join-Path $stage 'IddSampleDriver.cat')
          if ($LASTEXITCODE -ne 0) { throw 'Catalog test-signing failed' }
          "KITESCREEN_DRIVER_TEST_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Kitescreen-Driver-VM-Test-Only
          path: ${{ env.KITESCREEN_DRIVER_TEST_DIR }}\*
